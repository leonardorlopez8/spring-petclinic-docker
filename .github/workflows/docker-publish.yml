name: Petclinic Docker CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests in Docker
        run: docker build --target test .

      - name: Build Docker image
        run: |
          docker build --target final \
            -t leonardorlopez/petclinic:${{ github.sha }} \
            -t leonardorlopez/petclinic:latest .
     
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        run: |
          docker push leonardorlopez/petclinic:${{ github.sha }}
          docker push leonardorlopez/petclinic:latest

      - name: Smoke test published image
        run: |
          docker pull leonardorlopez/petclinic:latest
          docker run -d --rm --name petclinic-smoke -p 8080:8080 leonardorlopez/petclinic:latest
          trap 'docker stop petclinic-smoke >/dev/null 2>&1 || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Petclinic respondió correctamente"
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker logs petclinic-smoke
              exit 1
            fi

            sleep 2
          done

          sleep 60
          docker stop petclinic-smoke